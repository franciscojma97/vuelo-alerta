name: Revisar vuelos
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      madrid_todo:
        description: "Revisar todas las fechas de Madrid"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency: revisar
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # si la corrida esperó en fila, usar el estado más reciente y no el de cuando se lanzó
      - name: Revisar precios
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          MADRID_TODO: ${{ inputs.madrid_todo && '1' || '0' }}
        run: ./revisar.sh && tail -3 estado/historial.log
      - name: Guardar estado
        run: |
          git config user.name "vuelos-bot"
          git config user.email "vuelos-bot@users.noreply.github.com"
          git add estado
          git commit -qm "Revisión $(TZ=America/Monterrey date '+%Y-%m-%d %H:%M')" || exit 0
          for intento in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 5))
          done
          exit 1
      - name: Apagar después de la última fecha
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/Monterrey date +%Y%m%d)" -gt 20270119 ]; then gh workflow disable revisar.yml -R ${{ github.repository }}; fi
